version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x declares peer typescript <6.1.0 and
      # eslint-plugin-obsidianmd 0.5.x needs typescript-eslint ^8.35.1, so
      # npm ci fails on TypeScript 7 (ERESOLVE, see PR #12). Drop this once
      # typescript-eslint and eslint-plugin-obsidianmd both accept 7.x.
      - dependency-name: typescript
        versions: ['>=7']
